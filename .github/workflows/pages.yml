# Publishes the cs2a install path to GitHub Pages:
#   https://elvonpiko.github.io/cs2a/             -> landing page
#   https://elvonpiko.github.io/cs2a/install.sh   -> curl | sudo bash target
#   https://elvonpiko.github.io/cs2a/bootstrap.sh -> the installer itself
#
# REQUIRES Settings > Pages > Source = "GitHub Actions". With the default
# "Deploy from a branch" the legacy Jekyll builder owns the site instead, this
# workflow's configure-pages step fails with "Get Pages site failed", and the
# root install.sh URL above 404s because the branch build serves the repo tree
# (scripts/install.sh) rather than the assembled public/ directory.
#
# Deploys from main only. The github-pages environment carries a deployment
# branch policy allowing "main", so a run whose ref is a tag is rejected before
# its first step — and because both push events fire together on a tagged push,
# the tag run also cancelled the main run through the concurrency group.
name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p public
          cp site/index.html public/
          cp scripts/install.sh public/
          cp scripts/bootstrap.sh public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
