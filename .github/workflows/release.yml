# Builds and publishes a GitHub Release with the prebuilt linux binaries:
#   dist/cs2a-agent, dist/cs2a-panel, packaged per architecture as
#   cs2a-linux-amd64.tar.gz and cs2a-linux-arm64.tar.gz.
# Triggered on v* tags. bootstrap.sh picks the asset from `uname -m` and
# verifies the matching .sha256, so both files must exist for both arches.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # templ is a tool directive in go.mod, so `make build` runs the exact
      # version this repo pins — nothing to install, nothing to drift.
      # Cross-compiling is free here: CGO is off and sqlite is modernc's pure-Go
      # driver, so the arm64 build needs no toolchain of its own.
      - name: Build and package
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" VERSION="${GITHUB_REF_NAME}" make build
            tar -czf "cs2a-linux-$arch.tar.gz" -C dist cs2a-agent cs2a-panel
            # a bare filename in the checksum keeps `sha256sum -c` working in
            # whatever directory the user downloaded the two assets into
            sha256sum "cs2a-linux-$arch.tar.gz" > "cs2a-linux-$arch.tar.gz.sha256"
            rm -rf dist
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cs2a-linux-amd64.tar.gz
            cs2a-linux-amd64.tar.gz.sha256
            cs2a-linux-arm64.tar.gz
            cs2a-linux-arm64.tar.gz.sha256
          generate_release_notes: true
