# Builds and publishes a GitHub Release with the prebuilt linux binaries:
#   dist/cs2a-agent, dist/cs2a-panel, packaged as cs2a-linux-amd64.tar.gz
# Triggered on v* tags. bootstrap.sh downloads exactly that asset name.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # templ is a tool directive in go.mod, so `make build` runs the exact
      # version this repo pins — nothing to install, nothing to drift.
      - name: Build linux/amd64
        run: CGO_ENABLED=0 VERSION="${GITHUB_REF_NAME}" make build

      # Both files stay in the workspace root and the checksum records a bare
      # filename, so `sha256sum -c cs2a-linux-amd64.tar.gz.sha256` works in
      # whatever directory the user downloaded the two assets into.
      - name: Package
        run: |
          tar -czf cs2a-linux-amd64.tar.gz -C dist cs2a-agent cs2a-panel
          sha256sum cs2a-linux-amd64.tar.gz > cs2a-linux-amd64.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cs2a-linux-amd64.tar.gz
            cs2a-linux-amd64.tar.gz.sha256
          generate_release_notes: true
